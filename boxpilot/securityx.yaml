# BoxPilot catalog manifest for SecurityX (schemaVersion 2). Source of truth for BoxPilot's
# catalog/securityx.yaml; `npm run check` validates it with BoxPilot's own validateManifest
# (BOXPILOT_DIR, default ../BoxPilot). Each release pins image.reference to the digest CI
# publishes, here and in BoxPilot's copy.
# Port 4747 is free in the catalog (BoxPilot itself 8787, BaselineWatch 8790, TheySpy 8797).
schemaVersion: 2
id: securityx
name: SecurityX
category: Security
icon: "🔐"
description: "Scans the git repositories on this server for committed secrets (gitleaks, whole history, values redacted) and vulnerable dependencies (osv-scanner), ranked in one report. Also drives the SecurityX attack-surface monitor for domains you own: new hostnames, DNS changes, expiring certificates and missing security headers."
website: https://github.com/AES256Afro/SecurityX
risk: low
# A scan report names the files and commits where secrets were found, so it starts on the tailnet only.
defaultExposure: tailnet
image:
  reference: ghcr.io/aes256afro/securityx:0.2.2@sha256:ce8c6be56bed0bbdf106f46e360fad8179562c412534dd85940b348f434014e4
  version: "0.2.2"
user: "1000:1000"
ports:
  - id: web
    label: Web UI
    container: 4747
    host: 4747
    exposure: lan
volumes:
  - id: data
    label: Latest scan report
    container: /data
    path: data
    description: The latest repository scan. A new scan from the page replaces it.
  - id: repos
    label: Repositories to scan
    container: /repos
    hostPath: /srv/projects
    readOnly: true
    configurable: true
    backup: false
    description: Folder on this server whose git repositories are scanned, up to six levels down. Mounted read-only.
env:
  - name: SECURITYX_UI_KEY
    label: Access key
    type: password
    secret: true
    generate: true
    description: Generated by BoxPilot. The page asks for it once per browser tab. At least 32 characters if you replace it.
  - name: SECURITYX_MONITOR_URL
    label: Monitor address (optional)
    description: "The address `cf deploy` printed for your SecurityX monitor Worker, such as https://securityx-monitor.example.workers.dev. Empty leaves the Domains page off."
    default: ""
  - name: SECURITYX_ADMIN_TOKEN
    label: Monitor admin token (optional)
    type: password
    secret: true
    description: The monitor's ADMIN_TOKEN. It is only ever sent to the monitor address above and never reaches the browser.
    default: ""
signIn:
  path: /
  port: web
  passwordEnv: SECURITYX_UI_KEY
  note: There is no username. Paste the access key when the page asks for it.
health:
  kind: healthcheck
  timeoutSeconds: 60
notes: >-
  Point "Repositories to scan" at the folder that holds your checkouts before installing; it is
  mounted read-only. Open the page, paste the access key, and start a scan. Secrets are found in
  the full commit history, so one deleted in a later commit is still reported and must be rotated;
  the report never holds the secret itself. Dependency scanning sends package names and versions
  to the OSV database (api.osv.dev). The Domains page needs the monitor's address and admin token:
  the monitor runs on Cloudflare, not on this server.
