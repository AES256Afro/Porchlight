name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # BoxPilot's catalog validator checks boxpilot/porchlight.yaml (invariant 9). It must run: a
      # checkout that fails fails the job, and BOXPILOT_REQUIRED=1 below fails the check when the
      # schema is missing, so it never passes without running (S44). It runs BoxPilot's code, so it is
      # pinned to a release's commit, not whatever its default branch holds.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: AES256Afro/BoxPilot
          ref: 20e5b7696d75a9520e8c824e96917c48ea8f9b1b # v1.253.0
          path: .boxpilot
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          # npm's download cache, keyed by the three lockfiles, so an unchanged install fetches nothing.
          cache: npm
          cache-dependency-path: |
            package-lock.json
            monitor/package-lock.json
            cli/package-lock.json
      - run: npm ci
      - run: npm --prefix monitor ci
      - run: npm --prefix cli ci
      - run: npm run check
        env:
          BOXPILOT_DIR: .boxpilot
          BOXPILOT_REQUIRED: "1"
      - name: The tag names this tree's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'const v = require("./cli/package.json").version; if (process.env.GITHUB_REF_NAME !== `v${v}`) { console.error(`tag ${process.env.GITHUB_REF_NAME} but cli/package.json says ${v}`); process.exit(1); }'

  # The tests of both packages. Beside the checks and the image, not after them: the three jobs take
  # about as long as the slowest, and publishing waits for all of them.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            monitor/package-lock.json
            cli/package-lock.json
      - run: npm ci
      - run: npm --prefix monitor ci
      - run: npm --prefix cli ci
      # The tests that run the real gitleaks and osv-scanner (the hostile-repository ones among them)
      # skip on a computer without them. Here they must run, with the image's pinned versions and checksums.
      - name: Install the scanners
        run: |
          set -eu
          cd "$RUNNER_TEMP"
          gitleaks_version=8.30.1
          osv_version=2.7.1
          wget -qO gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          wget -qO osv-scanner "https://github.com/google/osv-scanner/releases/download/v${osv_version}/osv-scanner_linux_amd64"
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
          sudo install -m 0755 gitleaks osv-scanner /usr/local/bin/
      - run: npm test
        env:
          # A test that needs a scanner fails rather than skips when it is missing.
          PORCHLIGHT_REQUIRE_SCANNERS: "1"

  # The image BoxPilot runs: it refuses to listen without a key, answers /healthz, keeps its API
  # behind the key, and the real scanners find a secret in a repository owned by another user.
  # Once for each platform the publish job pushes, each on a runner of that platform, so the arm64
  # image is run, not only built (BLD-B2).
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # buildx, so the image's layers are kept between runs: a change to the CLI's sources rebuilds
      # only the last layers, not the scanners' downloads.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: porchlight:ci
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,scope=image-${{ matrix.arch }},mode=max
      - name: Smoke test (${{ matrix.platform }})
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # The image that was loaded is this platform's, and the smoke test runs it natively.
          test "$(docker image inspect porchlight:ci --format '{{.Os}}/{{.Architecture}}')" = "$PLATFORM"
          DOCKER_DEFAULT_PLATFORM="$PLATFORM" sh scripts/container-smoke.sh porchlight:ci

  # A version tag publishes ghcr.io/aes256afro/porchlight:<version>, and the same image under the
  # path BoxPilot's catalog pins by digest, ghcr.io/aes256afro/securityx:<version>. Both packages
  # must be public so any BoxPilot can pull them; a new package starts private (see the README).
  # buildx attaches its SBOM and build provenance beside it in the registry, and GitHub's artifact
  # attestation (Sigstore-signed, checked with `gh attestation verify`, README "Verify a download")
  # is pushed beside each name. Both platforms were smoke-tested by the container job, built from
  # the same Dockerfile with these layers cached.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # GitHub's artifact attestations: a short-lived signing certificate, the attestation, and its record.
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/aes256afro/porchlight
      # The path BoxPilot servers have pinned since before the rename; published alongside until they move.
      OLD_IMAGE: ghcr.io/aes256afro/securityx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # arm64 too: plenty of home servers are a Raspberry Pi or another ARM board.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # The container driver: the default docker driver cannot attach attestations to a push.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.OLD_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # The layers the container job just built for each platform; the release's own are kept too.
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-arm64
            type=gha,scope=image-release
          cache-to: type=gha,scope=image-release,mode=max
      - name: Attest the image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest the image under its earlier path
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.OLD_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Digest for the BoxPilot manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Pin this as image.reference in boxpilot/porchlight.yaml:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${OLD_IMAGE}:${GITHUB_REF_NAME#v}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "The same image: \`${IMAGE}:${GITHUB_REF_NAME#v}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  # The Mac app's DMG, built from the tag on an Apple silicon runner by the same script as by hand,
  # with Node's own release build and the scanners' release builds at the image's pinned versions,
  # each checked against its published checksum. Searched for anything of the runner, attested, and
  # handed to the release job.
  dmg:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, test, container]
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # nodejs.org's own build, which links only to macOS's libraries (build.sh checks), with its LICENSE beside bin/.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # Laid out as build.sh expects of each program: <folder>/bin/<program> and <folder>/LICENSE.
      - name: Install the scanners
        run: |
          set -eu
          gitleaks_version=8.30.1
          osv_version=2.7.1
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools/gitleaks/bin" "$tools/osv-scanner/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_darwin_arm64.tar.gz"
          echo "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5  gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf gitleaks.tar.gz -C "$tools/gitleaks" gitleaks LICENSE
          mv "$tools/gitleaks/gitleaks" "$tools/gitleaks/bin/gitleaks"
          curl -fsSLo "$tools/osv-scanner/bin/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${osv_version}/osv-scanner_darwin_arm64"
          echo "b22c02877a811c8f78956e8643efa554932b7378f590d13f8e97d4e9448a29f3  $tools/osv-scanner/bin/osv-scanner" | shasum -a 256 -c -
          # osv-scanner's release has no licence beside the binary: the one in its repository at that tag.
          curl -fsSLo "$tools/osv-scanner/LICENSE" "https://raw.githubusercontent.com/google/osv-scanner/v${osv_version}/LICENSE"
          echo "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30  $tools/osv-scanner/LICENSE" | shasum -a 256 -c -
          chmod 0755 "$tools/gitleaks/bin/gitleaks" "$tools/osv-scanner/bin/osv-scanner"
          echo "$tools/gitleaks/bin" >> "$GITHUB_PATH"
          echo "$tools/osv-scanner/bin" >> "$GITHUB_PATH"
      - name: Build the DMG
        run: sh mac/build.sh --dmg
      - name: Search the DMG for anything of the runner
        id: dmg
        run: |
          set -eu
          version=$(node -p 'require("./cli/package.json").version')
          dmg="mac/build/Porchlight-${version}-arm64.dmg"
          sh scripts/check-dmg.sh "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
      - name: Attest the DMG
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.dmg.outputs.path }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  # A draft release for the tag with the DMG and SHA256SUMS. It stays a draft: the owner writes the
  # notes and publishes it (RELEASING.md). If a release for the tag exists already, the two files are
  # added to it. Before that, the DMG's attestation is checked the way the README tells a reader to.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, dmg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -eu
          sha256sum -- *.dmg > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Check the DMG's attestation
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for dmg in *.dmg; do
            gh attestation verify "$dmg" --repo "$GITHUB_REPOSITORY" --source-ref "$GITHUB_REF"
          done
      - name: Draft the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber -- *.dmg SHA256SUMS
          else
            {
              echo "Draft by CI: write the notes (RELEASING.md), then publish."
              echo
              echo "Image: \`ghcr.io/aes256afro/porchlight:${GITHUB_REF_NAME#v}@${DIGEST}\`"
              echo
              echo "SHA-256 of the files attached here:"
              echo
              echo '```'
              cat SHA256SUMS
              echo '```'
              echo
              echo "To check a download, see \"Verify a download\" in the README."
            } > notes.md
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "Porchlight ${GITHUB_REF_NAME#v}" --notes-file notes.md -- *.dmg SHA256SUMS
          fi
