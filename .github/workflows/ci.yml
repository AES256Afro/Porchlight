name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # BoxPilot's catalog validator checks boxpilot/securityx.yaml. If the repository is not
      # reachable the step is skipped and the manifest still gets its local checks.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        continue-on-error: true
        with:
          repository: AES256Afro/BoxPilot
          path: .boxpilot
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm --prefix monitor ci
      - run: npm --prefix cli ci
      - run: npm run check
        env:
          BOXPILOT_DIR: .boxpilot
      - run: npm test
      - name: The tag names this tree's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node -e 'const v = require("./cli/package.json").version; if (process.env.GITHUB_REF_NAME !== `v${v}`) { console.error(`tag ${process.env.GITHUB_REF_NAME} but cli/package.json says ${v}`); process.exit(1); }'

  # The image BoxPilot runs: it refuses to listen without a key, answers /healthz, keeps its API
  # behind the key, and the real scanners find a secret in a repository owned by another user.
  container:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t securityx:ci .
      - run: sh scripts/container-smoke.sh securityx:ci

  # A version tag publishes ghcr.io/aes256afro/securityx:<version>, the image BoxPilot pins by
  # digest. The package stays private, like this repository. Its SBOM and build provenance are
  # attached by buildx and stored beside it in the registry. Nothing is signed with Sigstore's
  # keyless flow: that writes the repository's name and the digest to a public transparency log.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/aes256afro/securityx
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # arm64 too: plenty of home servers are a Raspberry Pi or another ARM board.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      # The container driver: the default docker driver cannot attach attestations to a push.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Digest for BoxPilot's catalog
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Pin this in boxpilot/securityx.yaml and BoxPilot's catalog/securityx.yaml:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${IMAGE}:${GITHUB_REF_NAME#v}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
