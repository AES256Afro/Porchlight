<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Porchlight</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/styles.css" />
		<script type="module" src="/app.js"></script>
	</head>
	<body>
		<a class="skip-link" href="#view">Skip to content</a>
		<div class="shell">
			<aside class="sidebar">
				<a class="brand" href="#/overview">
					<img src="/favicon.svg" alt="" width="20" height="20" />
					Porchlight
				</a>
				<nav id="nav" class="nav" aria-label="Sections"></nav>
				<div id="scan-status" class="scan-status" role="status" aria-live="polite"></div>
			</aside>
			<main id="view" tabindex="-1"></main>
		</div>
		<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
		<noscript><p class="noscript">Porchlight needs JavaScript to show your scans.</p></noscript>
	</body>
</html>
