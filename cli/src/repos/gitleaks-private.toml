# Private data: Porchlight's own rules, added to gitleaks' built-in ones (gitleaks.toml) when a
# scan looks for private data (M7). rules.ts joins the two into the one config gitleaks is given with
# --config, so a scanned repository's own .gitleaks.toml is never used; this file holds rules only.
# gitleaks still runs with --redact: no value reaches Porchlight, which keeps the kind, the file, the
# line and a count (invariant 3).
#
# Every id starts with "private-", which is how Porchlight tells these matches from secrets. A rule
# ending in -example or -test matches values published for examples and testing; its main rule
# leaves those to it rather than dropping them, so example data is listed, ranked low.
#
# Numbers are matched with or without the spaces or dashes people write them with. There is no
# checksum (Luhn, IBAN mod 97): it would need the value, which gitleaks never hands over. Card numbers
# are told apart by issuer prefixes and length, IBANs by country and length.


[[rules]]
id = "private-email"
description = "Email address"
regex = '''(?i)\b[a-z0-9][a-z0-9._%+-]{0,63}@(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,24}\b'''
keywords = ["@"]

  [[rules.allowlists]]
  description = "Example and test addresses (private-email-example matches them), and addresses that name no one: no-reply, git over SSH, image names such as icon@2x.png"
  regexTarget = "match"
  regexes = ['''(?i)@(?:[a-z0-9-]+\.)*(?:example\.(?:com|org|net|edu)|example|test|invalid|localhost)$''', '''(?i)^(?:no-?reply|git)@|@users\.noreply\.github\.com$''', '''(?i)\.(?:png|jpe?g|gif|svg|webp|avif|ico|js|mjs|ts|css|scss|map|json|md)$''']

[[rules]]
id = "private-email-example"
description = "Example or test email address"
regex = '''(?i)\b[a-z0-9][a-z0-9._%+-]{0,63}@(?:[a-z0-9-]+\.)*(?:example\.(?:com|org|net|edu)|example|test|invalid|localhost)\b'''
keywords = ["@"]

[[rules]]
id = "private-phone"
description = "Phone number"
regex = '''(?:\+[1-9]\d{0,2}[ .-]?(?:\(\d{1,4}\)[ .-]?)?\d{2,4}(?:[ .-]\d{2,4}){1,4}|\(\d{3}\)[ .-]?\d{3}[ .-]\d{4}|\b\d{3}[.-]\d{3}[.-]\d{4})\b'''

  [[rules.allowlists]]
  description = "Numbers set aside for fiction and examples: private-phone-example matches them"
  regexTarget = "match"
  regexes = ['''(?:\+?1[ .-]?)?(?:\(\d{3}\)|\b\d{3})?[ .-]?555[ .-]01\d{2}\b|\+?44[ .-]?\(?0?\)?20[ .-]?7946[ .-]?0\d{3}\b''']

[[rules]]
id = "private-phone-example"
description = "Example phone number"
regex = '''(?:\+?1[ .-]?)?(?:\(\d{3}\)|\b\d{3})?[ .-]?555[ .-]01\d{2}\b|\+?44[ .-]?\(?0?\)?20[ .-]?7946[ .-]?0\d{3}\b'''
keywords = ["555", "7946"]

[[rules]]
id = "private-us-ssn"
description = "US Social Security number"
regex = '''\b(?:00[1-9]|0[1-9]\d|[1-5]\d{2}|6[0-57-9]\d|66[0-57-9]|[78]\d{2})-(?:0[1-9]|[1-9]\d)-(?:000[1-9]|00[1-9]\d|0[1-9]\d{2}|[1-9]\d{3})\b'''

  [[rules.allowlists]]
  description = "Numbers published as examples: private-us-ssn-example matches them"
  regexTarget = "match"
  regexes = ['''\b(?:078-05-1120|219-09-9999|123-45-6789)\b''']

[[rules]]
id = "private-us-ssn-example"
description = "Example US Social Security number"
regex = '''\b(?:078-05-1120|219-09-9999|123-45-6789)\b'''

[[rules]]
id = "private-payment-card"
description = "Payment card number"
regex = '''\b(?:4\d{3}|5[1-5]\d{2}|2(?:22[1-9]|2[3-9]\d|[3-6]\d{2}|7[01]\d|720)|6011|65\d{2})(?:[ -]?\d{4}){3}\b|\b3[47]\d{2}[ -]?\d{6}[ -]?\d{5}\b'''

  [[rules.allowlists]]
  description = "Card numbers payment services publish for testing: private-payment-card-test matches them"
  regexTarget = "match"
  regexes = ['''\b(?:4111[ -]?1111[ -]?1111[ -]?1111|4242[ -]?4242[ -]?4242[ -]?4242|4012[ -]?8888[ -]?8888[ -]?1881|4000[ -]?0566[ -]?5566[ -]?5556|4000[ -]?0000[ -]?0000[ -]?0002|4000[ -]?0000[ -]?0000[ -]?9995|4000[ -]?0025[ -]?0000[ -]?3155|4000[ -]?0000[ -]?0000[ -]?0077|4000[ -]?0000[ -]?0000[ -]?0093|4000[ -]?0000[ -]?0000[ -]?3220|5555[ -]?5555[ -]?5555[ -]?4444|5105[ -]?1051[ -]?0510[ -]?5100|5200[ -]?8282[ -]?8282[ -]?8210|2223[ -]?0031[ -]?2200[ -]?3222|6011[ -]?1111[ -]?1111[ -]?1117|6011[ -]?0009[ -]?9013[ -]?9424|3782[ -]?822463[ -]?10005|3714[ -]?496353[ -]?98431|3787[ -]?344936[ -]?71000|4000[ -]?00\d{2}[ -]?\d{4}[ -]?\d{4})\b''']

[[rules]]
id = "private-payment-card-test"
description = "Test payment card number"
regex = '''\b(?:4111[ -]?1111[ -]?1111[ -]?1111|4242[ -]?4242[ -]?4242[ -]?4242|4012[ -]?8888[ -]?8888[ -]?1881|4000[ -]?0566[ -]?5566[ -]?5556|4000[ -]?0000[ -]?0000[ -]?0002|4000[ -]?0000[ -]?0000[ -]?9995|4000[ -]?0025[ -]?0000[ -]?3155|4000[ -]?0000[ -]?0000[ -]?0077|4000[ -]?0000[ -]?0000[ -]?0093|4000[ -]?0000[ -]?0000[ -]?3220|5555[ -]?5555[ -]?5555[ -]?4444|5105[ -]?1051[ -]?0510[ -]?5100|5200[ -]?8282[ -]?8282[ -]?8210|2223[ -]?0031[ -]?2200[ -]?3222|6011[ -]?1111[ -]?1111[ -]?1117|6011[ -]?0009[ -]?9013[ -]?9424|3782[ -]?822463[ -]?10005|3714[ -]?496353[ -]?98431|3787[ -]?344936[ -]?71000|4000[ -]?00\d{2}[ -]?\d{4}[ -]?\d{4})\b'''

[[rules]]
id = "private-iban"
description = "Bank account number (IBAN)"
regex = '''\b(?:AD\d{2}(?: ?[A-Z0-9]{4}){5}|AT\d{2}(?: ?\d{4}){4}|BE\d{2}(?: ?\d{4}){3}|CH\d{2}(?: ?[A-Z0-9]{4}){4} ?[A-Z0-9]|CZ\d{2}(?: ?\d{4}){5}|DE\d{2}(?: ?\d{4}){4} ?\d{2}|DK\d{2}(?: ?\d{4}){3} ?\d{2}|ES\d{2}(?: ?\d{4}){5}|FI\d{2}(?: ?\d{4}){3} ?\d{2}|FR\d{2}(?: ?[A-Z0-9]{4}){5} ?[A-Z0-9]{3}|GB\d{2} ?[A-Z]{4}(?: ?\d{4}){3} ?\d{2}|GR\d{2}(?: ?[A-Z0-9]{4}){5} ?[A-Z0-9]{3}|HU\d{2}(?: ?\d{4}){6}|IE\d{2} ?[A-Z]{4}(?: ?\d{4}){3} ?\d{2}|IS\d{2}(?: ?\d{4}){5} ?\d{2}|IT\d{2} ?[A-Z]\d{3}(?: ?[A-Z0-9]{4}){4} ?[A-Z0-9]{3}|LU\d{2}(?: ?[A-Z0-9]{4}){4}|NL\d{2} ?[A-Z]{4}(?: ?\d{4}){2} ?\d{2}|NO\d{2}(?: ?\d{4}){2} ?\d{3}|PL\d{2}(?: ?\d{4}){6}|PT\d{2}(?: ?\d{4}){5} ?\d|RO\d{2} ?[A-Z]{4}(?: ?[A-Z0-9]{4}){4}|SE\d{2}(?: ?\d{4}){5}|SK\d{2}(?: ?\d{4}){5})\b'''

  [[rules.allowlists]]
  description = "IBANs published as examples: private-iban-example matches them"
  regexTarget = "match"
  regexes = ['''\b(?:DE89 ?3704 ?0044 ?0532 ?0130 ?00|GB82 ?WEST ?1234 ?5698 ?7654 ?32|GB29 ?NWBK ?6016 ?1331 ?9268 ?19|GB33 ?BUKB ?2020 ?1555 ?5555 ?55|NL91 ?ABNA ?0417 ?1643 ?00|FR14 ?2004 ?1010 ?0505 ?0001 ?3M02 ?606|FR76 ?3000 ?6000 ?0112 ?3456 ?7890 ?189|ES91 ?2100 ?0418 ?4502 ?0005 ?1332|CH93 ?0076 ?2011 ?6238 ?5295 ?7|AT61 ?1904 ?3002 ?3457 ?3201|BE68 ?5390 ?0754 ?7034|IT60 ?X054 ?2811 ?1010 ?0000 ?0123 ?456|PL61 ?1090 ?1014 ?0000 ?0712 ?1981 ?2874|SE45 ?5000 ?0000 ?0583 ?9825 ?7466|NO93 ?8601 ?1117 ?947|DK50 ?0040 ?0440 ?1162 ?43|FI21 ?1234 ?5600 ?0007 ?85|PT50 ?0002 ?0123 ?1234 ?5678 ?9015 ?4|IE29 ?AIBK ?9311 ?5212 ?3456 ?78|LU28 ?0019 ?4006 ?4475 ?0000)\b''']

[[rules]]
id = "private-iban-example"
description = "Example bank account number (IBAN)"
regex = '''\b(?:DE89 ?3704 ?0044 ?0532 ?0130 ?00|GB82 ?WEST ?1234 ?5698 ?7654 ?32|GB29 ?NWBK ?6016 ?1331 ?9268 ?19|GB33 ?BUKB ?2020 ?1555 ?5555 ?55|NL91 ?ABNA ?0417 ?1643 ?00|FR14 ?2004 ?1010 ?0505 ?0001 ?3M02 ?606|FR76 ?3000 ?6000 ?0112 ?3456 ?7890 ?189|ES91 ?2100 ?0418 ?4502 ?0005 ?1332|CH93 ?0076 ?2011 ?6238 ?5295 ?7|AT61 ?1904 ?3002 ?3457 ?3201|BE68 ?5390 ?0754 ?7034|IT60 ?X054 ?2811 ?1010 ?0000 ?0123 ?456|PL61 ?1090 ?1014 ?0000 ?0712 ?1981 ?2874|SE45 ?5000 ?0000 ?0583 ?9825 ?7466|NO93 ?8601 ?1117 ?947|DK50 ?0040 ?0440 ?1162 ?43|FI21 ?1234 ?5600 ?0007 ?85|PT50 ?0002 ?0123 ?1234 ?5678 ?9015 ?4|IE29 ?AIBK ?9311 ?5212 ?3456 ?78|LU28 ?0019 ?4006 ?4475 ?0000)\b'''

[[rules]]
id = "private-gps"
description = "GPS coordinates precise enough to find a building"
regex = '''(?:^|[^\d.])((?:[-+]?(?:1[0-7]\d|180|[1-9]\d?)\.\d{4,}\s*,\s*[-+]?(?:1[0-7]\d|180|[1-9]?\d)\.\d{4,}|[-+]?0\.\d{4,}\s*,\s*[-+]?(?:1[0-7]\d|180|[1-9]\d?)\.\d{4,}))'''
secretGroup = 1

[[rules]]
id = "private-ip"
description = "Private network address"
regex = '''\b(?:10\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|172\.(?:1[6-9]|2\d|3[01])\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)|192\.168\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d))\b'''

[[rules]]
id = "private-tailnet-ip"
description = "Tailscale or carrier-grade NAT address"
regex = '''\b100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\b'''
keywords = ["100."]

[[rules]]
id = "private-tailnet-name"
description = "Tailscale machine name"
regex = '''(?i)\b((?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+ts\.net)(?:[^a-z0-9.-]|$)'''
secretGroup = 1
keywords = ["ts.net"]

[[rules]]
id = "private-internal-name"
description = "Internal host name"
regex = '''(?i)\b((?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:internal|intranet|corp|lan|local|home\.arpa))(?:[^a-z0-9.-]|$)'''
secretGroup = 1
keywords = [".internal", ".intranet", ".corp", ".lan", ".local", ".home.arpa"]
